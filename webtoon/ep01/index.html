<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역천의 시우 — EP01</title>
<style>
  :root{
    --bg:#0b0d12; --bg2:#12151d; --ink:#e8eaf0; --muted:#8b93a7;
    --line:#232838; --accent:#2fbfa6; --err:#b0202a; --gold:#c9a24a;
    --ice:#7fb6d6; --shadow:0 12px 40px rgba(0,0,0,.55);
    --maxw:560px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.65}
  body{overflow-x:hidden}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 0 80px}

  /* Cover */
  .cover{position:relative;min-height:78vh;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;padding:48px 28px;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(47,191,166,.10), transparent 60%),
      radial-gradient(90% 60% at 50% 120%, rgba(176,32,42,.12), transparent 60%),
      linear-gradient(180deg,#05070b,#0b0d12)}
  .cover .kicker{letter-spacing:.5em;font-size:12px;color:var(--muted);margin-bottom:22px;
    text-transform:uppercase}
  .cover h1{font-size:clamp(38px,11vw,64px);margin:0;font-weight:800;letter-spacing:-.01em;
    text-shadow:0 0 30px rgba(47,191,166,.25)}
  .cover h1 .han{display:block;font-size:.42em;color:var(--gold);letter-spacing:.35em;
    font-weight:600;margin-top:14px}
  .cover .ep{margin-top:30px;font-size:15px;color:var(--muted)}
  .cover .ep b{color:var(--accent);font-weight:700}
  .cover .log{max-width:420px;margin:30px auto 0;font-size:14.5px;color:#c4c9d6;line-height:1.8}
  .cover .scroll-cue{margin-top:44px;font-size:12px;color:var(--muted);animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:1}}

  .note-banner{max-width:var(--maxw);margin:0 auto;padding:16px 22px;font-size:12.5px;
    color:#cdd3e0;background:linear-gradient(180deg,#161a24,#12151d);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);line-height:1.7}
  .note-banner b{color:var(--gold)}

  /* Section divider */
  .sec{margin:54px 0 8px;text-align:center;color:var(--muted);font-size:13px;letter-spacing:.28em}
  .sec span{display:inline-block;padding:0 16px;position:relative}
  .sec span:before,.sec span:after{content:"";position:absolute;top:50%;width:42px;height:1px;
    background:linear-gradient(90deg,transparent,var(--line))}
  .sec span:before{right:100%}.sec span:after{left:100%;transform:scaleX(-1)}

  /* Panel */
  .panel{position:relative;margin:0 0 6px;background:var(--bg2);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:0}
  .stage{position:relative;padding:26px 24px 22px;min-height:150px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.015), transparent 30%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px)}
  .pmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .pnum{font-variant-numeric:tabular-nums;font-weight:800;font-size:12px;color:#0b0d12;
    background:var(--gold);border-radius:5px;padding:2px 8px}
  .chip{font-size:10.5px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;text-transform:uppercase}
  .chip.loc{color:var(--ice);border-color:rgba(127,182,214,.35)}
  .chip.shot{color:#d6c187;border-color:rgba(201,162,74,.3)}
  .comp{font-size:13px;color:#aeb6c8;font-style:italic;border-left:2px solid var(--line);
    padding:2px 0 2px 12px;margin:0 0 16px}

  /* dialogue elements */
  .lines{display:flex;flex-direction:column;gap:11px}
  .bub{position:relative;max-width:88%;padding:11px 15px;border-radius:16px;font-size:15px;
    box-shadow:var(--shadow);line-height:1.55;word-break:keep-all}
  .who{display:block;font-size:10.5px;letter-spacing:.05em;color:var(--muted);
    margin:0 4px 4px;text-transform:uppercase}
  /* say */
  .say .bub{background:#f4f6fb;color:#141721;border:1px solid #d9deea;align-self:flex-start;
    border-bottom-left-radius:5px}
  .say.right{align-self:flex-end}
  .say.right .bub{border-bottom-left-radius:16px;border-bottom-right-radius:5px}
  .row{display:flex;flex-direction:column}
  .row.right{align-items:flex-end}
  /* think */
  .think .bub{background:#1b2130;color:#c7cfe0;align-self:flex-start;
    border:1px dashed #414c66;border-radius:20px;font-style:italic}
  .think .who{color:#5fd4bf}
  /* shout */
  .shout .bub{background:#fff;color:#0b0d12;font-weight:800;font-size:18px;letter-spacing:.01em;
    border:2.5px solid #0b0d12;align-self:center;text-align:center;
    clip-path:polygon(4% 8%,12% 0,22% 9%,34% 1%,46% 9%,58% 1%,70% 9%,82% 1%,94% 9%,100% 22%,95% 40%,100% 60%,94% 82%,84% 76%,72% 92%,60% 78%,48% 94%,36% 78%,24% 92%,12% 78%,3% 84%,0 60%,5% 42%,0 22%);
    padding:20px 26px}
  /* sfx */
  .sfx{align-self:flex-start;color:#727b90;font-weight:800;font-style:italic;
    font-size:16px;letter-spacing:.02em;opacity:.85;transform:rotate(-3deg);padding:2px 6px}
  /* system boxes */
  .sys{align-self:center;width:92%;font-family:"Courier New",ui-monospace,monospace;
    font-size:13.5px;letter-spacing:.02em;padding:13px 15px;border-radius:4px;position:relative;
    background:#080a0e;line-height:1.5}
  .sys .who{font-family:inherit;text-align:center;margin-bottom:6px}
  .sys.err{border:1px solid var(--err);color:#ff6b74;
    box-shadow:0 0 22px rgba(176,32,42,.28),inset 0 0 30px rgba(176,32,42,.08)}
  .sys.err .who{color:#ff8f96}
  .sys.scan{border:1px solid var(--accent);color:#7ff0dc;
    box-shadow:0 0 22px rgba(47,191,166,.25),inset 0 0 30px rgba(47,191,166,.07)}
  .sys.scan .who{color:#7ff0dc}
  .sys.modern{border:1px solid #38405a;color:#9fb0cf;background:rgba(12,16,26,.6);
    font-size:12px;opacity:.85}
  .sys .glitch{text-shadow:1.5px 0 rgba(47,191,166,.5),-1.5px 0 rgba(176,32,42,.4)}
  .sys code{color:inherit;font-family:inherit}

  .silent{align-self:center;font-size:11px;letter-spacing:.25em;color:#4b556b;
    border:1px dashed #2b3245;border-radius:20px;padding:4px 14px;text-transform:uppercase}

  /* real rendered panel (art) */
  .art{display:block;margin:0 0 6px;background:#000;line-height:0}
  .art img{display:block;width:100%;height:auto}
  /* ending */
  .end{margin-top:40px;text-align:center;padding:52px 28px 20px;
    background:radial-gradient(90% 70% at 50% 0%, rgba(127,182,214,.10), transparent 65%)}
  .end .to-be{font-size:26px;font-weight:800;letter-spacing:.02em;color:#eaf1f6}
  .end .to-be span{color:var(--ice)}
  .end .seed{margin:24px auto 0;max-width:440px;font-size:13.5px;color:#aeb6c8;line-height:1.85;
    border-top:1px solid var(--line);padding-top:24px}
  .end .seed b{color:var(--accent)}

  footer{margin-top:36px;padding:26px 24px;border-top:1px solid var(--line);
    font-size:11.5px;color:#5b647a;line-height:1.8}
  footer b{color:var(--muted)}
  @media(max-width:480px){.stage{padding:22px 16px 18px}.bub{font-size:14.5px;max-width:92%}}
</style>

<div class="wrap" id="wrap"></div>

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

for(const p of PANELS){
  if(p.sec){ wrap.insertAdjacentHTML('beforeend', `<div class="sec"><span>${esc(p.sec)}</span></div>`); continue; }
  let inner = '';
  if(p.silent){
    inner += `<div class="row" style="align-items:center"><div class="silent">무대사 · 침묵 패널</div></div>`;
  }
  for(const l of (p.lines||[])){
    const right = l.r ? ' right' : '';
    if(l.t==='say'){
      inner += `<div class="row say${right}"><span class="who">${esc(l.who||'')}</span><div class="bub">${esc(l.x)}</div></div>`;
    } else if(l.t==='think'){
      inner += `<div class="row think${right}"><span class="who">${esc(l.who||'')} · 생각</span><div class="bub">${esc(l.x)}</div></div>`;
    } else if(l.t==='shout'){
      inner += `<div class="row shout"><div class="bub">${esc(l.x)}</div></div>`;
    } else if(l.t==='sfx'){
      inner += `<div class="sfx">${esc(l.x)}</div>`;
    } else if(l.t==='err'||l.t==='scan'||l.t==='modern'){
      const cls = l.t;
      const g = l.g ? ' glitch' : '';
      inner += `<div class="sys ${cls}"><span class="who">${esc(l.who||'SYSTEM')}</span><code class="${g}">${esc(l.x)}</code></div>`;
    }
  }
  wrap.insertAdjacentHTML('beforeend', `
   <div class="panel" id="panel-${p.n}">
     <div class="stage">
       <div class="pmeta">
         <span class="pnum">P${String(p.n).padStart(2,'0')}</span>
         <span class="chip loc">${esc(p.loc||'')}</span>
         <span class="chip shot">${esc(p.shot||'')}</span>
       </div>
       ${p.comp?`<div class="comp">${esc(p.comp)}</div>`:''}
       <div class="lines">${inner}</div>
     </div>
   </div>`);
}

// image-first upgrade: replace storyboard card with real rendered art when the JPG exists
let done = 0;
const numbered = PANELS.filter(p=>p.n);
for(const p of numbered){
  const n3 = String(p.n).padStart(3,'0');
  const src = `panels/panel_${n3}.jpg`;
  const probe = new Image();
  probe.onload = () => {
    const el = document.getElementById(`panel-${p.n}`);
    if(el){ el.className='art'; el.innerHTML=`<img src="${src}" alt="panel ${n3}" loading="lazy" decoding="async">`; }
    done++; const dc=document.getElementById('donecount'); if(dc) dc.textContent = `${done}/58`;
  };
  probe.src = src;
}
